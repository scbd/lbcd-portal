# Secrets required:
#
# Registry (org-level):
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token

name: CI

on:
  push:
    branches: ['**']
    tags: ['[0-9]*', 'v[0-9]*']
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

env:
  IMAGE_NAME: scbd/lbcd-portal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logic (same tags CircleCI pushed):
      #   version tag (v?N.N.N)  → tags=<tag without v> + latest, push=true
      #   master/dev/stg         → tags=<branch>,                 push=true
      #   release/<name>         → tags=release-<name>,           push=true
      #   other branches and PRs → tags=build-<sha>,              push=false
      # Pushes only happen from the scbd repo, never from forks.
      - name: Resolve image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${{ env.IMAGE_NAME }}"
          REF="${GITHUB_REF}"

          if [[ "${REF}" =~ ^refs/tags/v?([0-9]+(\.[0-9]+)*)$ ]]; then
            TAG="${BASH_REMATCH[1]}"
            echo "tags<<EOF"          >> $GITHUB_OUTPUT
            echo "${IMAGE}:${TAG}"    >> $GITHUB_OUTPUT
            echo "${IMAGE}:latest"    >> $GITHUB_OUTPUT
            echo "EOF"                >> $GITHUB_OUTPUT
            PUSH=true

          elif [[ "${REF}" =~ ^refs/heads/(master|dev|stg)$ ]]; then
            echo "tags=${IMAGE}:${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            PUSH=true

          elif [[ "${REF}" =~ ^refs/heads/release/(.+)$ ]]; then
            echo "tags=${IMAGE}:release-${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            PUSH=true

          else
            echo "tags=${IMAGE}:build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            PUSH=false
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REPOSITORY_OWNER}" != "scbd" ]]; then
            PUSH=false
          fi
          echo "push=${PUSH}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          build-args: VERSION=${{ github.sha }}
          load: true
          tags: ci-build:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is node:alpine: busybox wget is available, curl is not.
      - name: Test image
        run: |
          docker run --rm ci-build:local npm test
          docker run --name lbcd -d -p 8000:8000 ci-build:local
          for i in $(seq 1 10); do
            docker exec lbcd wget -q -O /dev/null http://127.0.0.1:8000/lbcd/ && exit 0
            sleep 3
          done
          docker logs lbcd
          exit 1

      - name: Push image
        if: steps.meta.outputs.push == 'true'
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker tag ci-build:local "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
